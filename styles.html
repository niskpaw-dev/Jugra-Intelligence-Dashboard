<style>
/* ════════════════════════════════════════════════════════════════════
   STYLES.HTML  ·  Design system + component styles
   ────────────────────────────────────────────────────────────────────
   Phase 2A scope: tokens, base, splash, app shell, login modal,
   dashboard. Forms/tables/modals untuk CRUD ditambah dalam Phase 2B.
   ════════════════════════════════════════════════════════════════════ */


/* ──────────────────────────────────────────────────────────────────
   DESIGN TOKENS  ·  Single source of truth, copy dari Phase 0
   ────────────────────────────────────────────────────────────────── */
:root {
  /* Color · OKLCH untuk perceptual uniformity */
  --bg:             oklch(0.97  0.012 80);
  --bg-elevated:    oklch(0.985 0.008 80);
  --bg-sunken:      oklch(0.94  0.015 80);

  --ink:            oklch(0.18  0.025 250);
  --ink-muted:      oklch(0.42  0.018 250);
  --ink-quiet:      oklch(0.62  0.012 250);

  --rule:           oklch(0.86  0.018 80);
  --rule-strong:    oklch(0.78  0.020 80);

  --accent:         oklch(0.42  0.130 25);
  --accent-soft:    oklch(0.92  0.040 25);
  --accent-strong:  oklch(0.32  0.130 25);

  --tag-umum:       oklch(0.45  0.090 145);
  --tag-umum-bg:    oklch(0.94  0.030 145);
  --tag-guru:       oklch(0.42  0.090 240);
  --tag-guru-bg:    oklch(0.94  0.025 240);
  --tag-admin:      oklch(0.42  0.130 25);
  --tag-admin-bg:   oklch(0.93  0.040 25);

  --danger:         oklch(0.50  0.180 25);
  --danger-soft:    oklch(0.94  0.040 25);

  /* Typography */
  --font-display: 'Fraunces', 'Source Serif 4', Georgia, serif;
  --font-body:    'Geist', 'Inter', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* Type scale · 1.25 ratio */
  --text-2xs: 11px;
  --text-xs:  12px;
  --text-sm:  14px;
  --text-base: 16px;
  --text-md:  18px;
  --text-lg:  22px;
  --text-xl:  28px;
  --text-2xl: 36px;
  --text-3xl: 48px;

  /* Spacing · 4px base */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;

  /* Radii · restrained */
  --r-sm:   2px;
  --r-md:   4px;
  --r-lg:   6px;
  --r-pill: 999px;

  /* Layout */
  --nav-width: 240px;
  --max-content: 1080px;

  /* Motion — per emil-design-eng: short, asymmetric enter/exit */
  --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in:    cubic-bezier(0.7, 0, 0.84, 0);
  --dur-fast:   120ms;
  --dur-base:   200ms;
  --dur-modal:  240ms;
}


/* ──────────────────────────────────────────────────────────────────
   RESET + BASE
   ────────────────────────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-feature-settings: 'ss01', 'ss02';
  font-size: var(--text-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
}

a {
  color: var(--accent);
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease-out);
}
a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: transparent;
  border: none;
  cursor: pointer;
}

input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

[hidden] { display: none !important; }


/* ──────────────────────────────────────────────────────────────────
   SPLASH SCREEN  ·  Visible sehingga auth check complete
   ────────────────────────────────────────────────────────────────── */
.splash {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 9999;
  animation: splash-fade-in 200ms var(--ease-out);
}

.splash.hide {
  animation: splash-fade-out 200ms var(--ease-in) forwards;
  pointer-events: none;
}

.splash-inner {
  text-align: center;
}

.splash-mark {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-2xl);
  font-variation-settings: 'opsz' 144, 'SOFT' 30;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: var(--space-2);
}

.splash-line {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-quiet);
}

@keyframes splash-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes splash-fade-out {
  from { opacity: 1; }
  to { opacity: 0; visibility: hidden; }
}


/* ──────────────────────────────────────────────────────────────────
   APP SHELL  ·  Sidebar nav + main content area
   ────────────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--nav-width) 1fr;
  min-height: 100vh;
}

.nav {
  background: var(--bg-elevated);
  border-right: 1px solid var(--rule);
  padding: var(--space-6) var(--space-5);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.nav-brand {
  padding-bottom: var(--space-5);
  margin-bottom: var(--space-5);
  border-bottom: 1px solid var(--rule);
}

.nav-brand-mark {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-lg);
  font-variation-settings: 'opsz' 48, 'SOFT' 40;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin-bottom: 2px;
}

.nav-brand-sub {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-quiet);
}

.nav-section-label {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-quiet);
  padding: 0 var(--space-3);
  margin: var(--space-5) 0 var(--space-2);
}
.nav-section-label:first-child { margin-top: 0; }

.nav-link {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--r-sm);
  font-size: var(--text-sm);
  color: var(--ink-muted);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  letter-spacing: -0.005em;
  text-align: left;
  width: 100%;
}

.nav-link:hover {
  background: var(--bg-sunken);
  color: var(--ink);
}

.nav-link.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
}

.nav-link .icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  opacity: 0.7;
}
.nav-link.active .icon { opacity: 1; }

.nav-foot {
  margin-top: auto;
  padding-top: var(--space-5);
  border-top: 1px solid var(--rule);
}

.nav-user {
  padding: var(--space-3);
  display: grid;
  gap: 2px;
}
.nav-user-name {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.nav-user-role {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-quiet);
}

.main {
  padding: var(--space-7) var(--space-6);
  max-width: var(--max-content);
  width: 100%;
  margin: 0 auto;
}


/* ──────────────────────────────────────────────────────────────────
   DASHBOARD COMPONENTS
   ────────────────────────────────────────────────────────────────── */
.dash-header {
  margin-bottom: var(--space-7);
  animation: enter-up var(--dur-base) var(--ease-out);
}

.dash-header .eyebrow {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-quiet);
  margin-bottom: var(--space-5);
}

.dash-header h1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: var(--text-2xl);
  font-variation-settings: 'opsz' 96, 'SOFT' 40;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: var(--space-3);
}

.dash-header h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
  font-variation-settings: 'opsz' 96, 'SOFT' 100;
}

.dash-header .principal {
  font-size: var(--text-md);
  color: var(--ink-muted);
  margin-bottom: 2px;
}

.dash-header .school {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-quiet);
}


/* Library Overview — ganti 6-stat-card grid */
.lib {
  animation: enter-up var(--dur-base) var(--ease-out) 60ms backwards;
}

.lib-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--rule-strong);
  margin-bottom: var(--space-3);
}

.lib-label {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-quiet);
}

.lib-total {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--ink-muted);
}
.lib-total strong { font-weight: 500; color: var(--ink); }

.lib-row {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: var(--space-4);
  align-items: baseline;
  padding: var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
  margin: 0 calc(-1 * var(--space-3));
  border-radius: var(--r-sm);
  text-align: left;
  width: calc(100% + (2 * var(--space-3)));
}

.lib-row:last-of-type { border-bottom: none; }
.lib-row:hover { background: var(--accent-soft); }

.lib-num {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--accent);
  letter-spacing: -0.01em;
}

.lib-name {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-md);
  font-variation-settings: 'opsz' 24;
  color: var(--ink);
  letter-spacing: -0.005em;
  line-height: 1.3;
}

.lib-sub {
  display: block;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--ink-quiet);
  font-weight: 400;
  margin-top: 2px;
  letter-spacing: 0;
}

.lib-count {
  font-family: var(--font-mono);
  font-size: var(--text-md);
  font-weight: 500;
  color: var(--ink);
  font-feature-settings: 'tnum';
  letter-spacing: -0.01em;
  min-width: 32px;
  text-align: right;
}

.lib-count.zero {
  color: var(--ink-quiet);
  font-weight: 400;
}

.lib-foot {
  text-align: right;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--ink-quiet);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--rule-strong);
}


/* Empty state untuk dashboard tiada data */
.empty {
  padding: var(--space-8) var(--space-5);
  text-align: center;
  border: 1px dashed var(--rule-strong);
  border-radius: var(--r-md);
  background: var(--bg-elevated);
}

.empty-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-lg);
  color: var(--ink);
  margin-bottom: var(--space-2);
}

.empty-desc {
  font-size: var(--text-sm);
  color: var(--ink-muted);
  margin-bottom: var(--space-4);
  max-width: 40ch;
  margin-left: auto;
  margin-right: auto;
}


/* ──────────────────────────────────────────────────────────────────
   BUTTONS
   ────────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  padding: 9px 18px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              transform 80ms var(--ease-out);
  letter-spacing: -0.005em;
  white-space: nowrap;
  user-select: none;
}

.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.btn-secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--rule-strong);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--bg-sunken);
  border-color: var(--ink-quiet);
}

.btn-ghost {
  background: transparent;
  color: var(--ink-muted);
  padding: 9px 12px;
}
.btn-ghost:hover:not(:disabled) {
  color: var(--ink);
  background: var(--bg-sunken);
}

.btn-danger {
  background: var(--danger);
  color: var(--bg);
  border-color: var(--danger);
}
.btn-danger:hover:not(:disabled) {
  background: oklch(0.42 0.18 25);
  border-color: oklch(0.42 0.18 25);
}

.btn-block { width: 100%; justify-content: center; }


/* ──────────────────────────────────────────────────────────────────
   FORM INPUTS
   ────────────────────────────────────────────────────────────────── */
.field {
  display: block;
  margin-bottom: var(--space-4);
}

.field-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--ink-muted);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin-bottom: var(--space-2);
}

.input {
  width: 100%;
  padding: 10px 14px;
  font-size: var(--text-base);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--rule-strong);
  border-radius: var(--r-md);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-out),
              background var(--dur-fast) var(--ease-out);
  font-feature-settings: 'ss01';
}

.input:hover { border-color: var(--ink-quiet); }
.input:focus {
  border-color: var(--accent);
  background: var(--bg-elevated);
}

.input.has-error {
  border-color: var(--danger);
}

.field-error {
  display: block;
  font-size: var(--text-xs);
  color: var(--danger);
  margin-top: var(--space-2);
  font-family: var(--font-body);
}


/* ──────────────────────────────────────────────────────────────────
   MODAL  ·  Backdrop + dialog
   ────────────────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: oklch(0.18 0.025 250 / 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-5);
  z-index: 100;
  animation: backdrop-in var(--dur-modal) var(--ease-out);
}

.modal-backdrop.closing {
  animation: backdrop-out 160ms var(--ease-in) forwards;
}

@keyframes backdrop-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes backdrop-out {
  to { opacity: 0; }
}

.modal {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  max-width: 440px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: modal-in var(--dur-modal) var(--ease-out);
}

.modal-backdrop.closing .modal {
  animation: modal-out 160ms var(--ease-in) forwards;
}

@keyframes modal-in {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes modal-out {
  to { opacity: 0; transform: translateY(8px) scale(0.98); }
}

.modal-head {
  padding: var(--space-5) var(--space-6) var(--space-4);
  border-bottom: 1px solid var(--rule);
}

.modal-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--text-lg);
  font-variation-settings: 'opsz' 48, 'SOFT' 50;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin-bottom: var(--space-1);
}

.modal-subtitle {
  font-size: var(--text-sm);
  color: var(--ink-muted);
}

.modal-body {
  padding: var(--space-5) var(--space-6);
}

.modal-foot {
  padding: var(--space-4) var(--space-6) var(--space-5);
  display: flex;
  gap: var(--space-3);
  justify-content: flex-end;
  border-top: 1px solid var(--rule);
}


/* ──────────────────────────────────────────────────────────────────
   LOGIN MODAL  ·  Specific styling
   ────────────────────────────────────────────────────────────────── */
.login-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-quiet);
  margin-bottom: var(--space-3);
}


/* ──────────────────────────────────────────────────────────────────
   TOAST NOTIFICATIONS
   ────────────────────────────────────────────────────────────────── */
.toast-root {
  position: fixed;
  bottom: var(--space-5);
  right: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: 200;
  pointer-events: none;
}

.toast {
  background: var(--ink);
  color: var(--bg);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  max-width: 380px;
  pointer-events: auto;
  animation: toast-in 240ms var(--ease-out);
  border-left: 3px solid var(--accent);
  letter-spacing: -0.005em;
  line-height: 1.4;
}

.toast.error      { border-left-color: var(--danger); }
.toast.success    { border-left-color: var(--tag-umum); }
.toast.removing {
  animation: toast-out 160ms var(--ease-in) forwards;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes toast-out {
  to { opacity: 0; transform: translateX(20px); }
}


/* ──────────────────────────────────────────────────────────────────
   LOADING STATE — inline spinner / skeleton
   ────────────────────────────────────────────────────────────────── */
.loading-bar {
  display: inline-block;
  width: 60px;
  height: 2px;
  background: var(--rule);
  border-radius: 1px;
  position: relative;
  overflow: hidden;
}
.loading-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 30%;
  background: var(--accent);
  border-radius: 1px;
  animation: loading-slide 1.2s infinite var(--ease-out);
}

@keyframes loading-slide {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(330%); }
}


/* ──────────────────────────────────────────────────────────────────
   SHARED ANIMATIONS
   ────────────────────────────────────────────────────────────────── */
@keyframes enter-up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Respect user motion preferences */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}


/* ──────────────────────────────────────────────────────────────────
   RESPONSIVE  ·  Tablet & mobile
   ────────────────────────────────────────────────────────────────── */
@media (max-width: 860px) {
  .app {
    grid-template-columns: 1fr;
  }
  .nav {
    position: relative;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--rule);
    padding: var(--space-5) var(--space-4);
  }
  .nav-foot { padding-top: var(--space-4); }
  .main { padding: var(--space-5) var(--space-4); }
  .dash-header h1 { font-size: var(--text-xl); }
  .lib-row {
    grid-template-columns: 32px 1fr auto;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-2);
  }
}

@media (max-width: 480px) {
  .modal { max-width: 100%; }
  .modal-head, .modal-body, .modal-foot {
    padding-left: var(--space-4);
    padding-right: var(--space-4);
  }
}
</style>
